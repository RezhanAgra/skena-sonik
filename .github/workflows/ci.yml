name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Type-check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build API (prisma generate + bundle)
        run: npm run build -w api
      - name: Type-check API
        run: npm run typecheck -w api
      - name: Type-check web
        run: npm run check -w web
      - name: Build web
        run: npm run build -w web

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          push: false
      - name: Build migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrate
          push: false
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: SITE_URL=https://example.com
          push: false
